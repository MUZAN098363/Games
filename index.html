<!DOCTYPE html>
<html>
<head>
<title>Mini Games Hub</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}
button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}
.game {
    display: none;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>🎮 Mini Games Website</h1>

<button onclick="showGame('guess')">Number Guess</button>
<button onclick="showGame('click')">Click Speed</button>
<button onclick="showGame('rps')">Rock Paper Scissors</button>

<!-- Number Guess Game -->
<div id="guess" class="game">
    <h2>Guess the Number (1-10)</h2>
    <input type="number" id="guessInput">
    <button onclick="checkGuess()">Guess</button>
    <p id="guessResult"></p>
</div>

<!-- Click Speed Game -->
<div id="click" class="game">
    <h2>Click Speed Game (5 sec)</h2>
    <button onclick="startClickGame()">Start</button>
    <h3 id="clickCount">0</h3>
</div>

<!-- Rock Paper Scissors -->
<div id="rps" class="game">
    <h2>Rock Paper Scissors</h2>
    <button onclick="play('rock')">Rock</button>
    <button onclick="play('paper')">Paper</button>
    <button onclick="play('scissors')">Scissors</button>
    <p id="rpsResult"></p>
</div>

<script>
function showGame(game) {
    document.querySelectorAll('.game').forEach(g => g.style.display = 'none');
    document.getElementById(game).style.display = 'block';
}

// Guess Game
let random = Math.floor(Math.random() * 10) + 1;
function checkGuess() {
    let user = document.getElementById("guessInput").value;
    if (user == random) {
        document.getElementById("guessResult").innerText = "Correct!";
    } else {
        document.getElementById("guessResult").innerText = "Try Again!";
    }
}

// Click Game
let count = 0;
function startClickGame() {
    count = 0;
    document.getElementById("clickCount").innerText = count;
    let btn = document.createElement("button");
    btn.innerText = "Click Me!";
    btn.onclick = () => {
        count++;
        document.getElementById("clickCount").innerText = count;
    };
    document.getElementById("click").appendChild(btn);

    setTimeout(() => {
        alert("Time up! Score: " + count);
        btn.remove();
    }, 5000);
}

// RPS Game
function play(user) {
    let choices = ["rock", "paper", "scissors"];
    let comp = choices[Math.floor(Math.random() * 3)];

    let result = "";
    if (user === comp) result = "Draw!";
    else if (
        (user === "rock" && comp === "scissors") ||
        (user === "paper" && comp === "rock") ||
        (user === "scissors" && comp === "paper")
    ) result = "You Win!";
    else result = "You Lose!";

    document.getElementById("rpsResult").innerText = 
        "Computer: " + comp + " | " + result;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Mobile Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #ui {
            position: absolute; top: 10px; width: 100%;
            text-align: center; color: white; font-family: sans-serif;
            pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        /* Virtual Joystick Styles */
        #joystick-container {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5);
            touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: white; border-radius: 50%;
            opacity: 0.8; transition: transform 0.1s;
        }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 7, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        scene.add(new THREE.GridHelper(100, 50));

        // Player & Target
        const player = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff4444 }));
        player.position.y = 0.5;
        scene.add(player);

        const target = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
        target.position.set(5, 0.5, -5);
        scene.add(target);

        // --- MOBILE CONTROLS (JOYSTICK) ---
        const knob = document.getElementById('joystick-knob');
        const container = document.getElementById('joystick-container');
        let moveX = 0, moveZ = 0;
        let dragging = false;

        const handleMove = (e) => {
            if (!dragging) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Calculate distance from center
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);

            // Move visual knob
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            knob.style.transform = `translate(${tx}px, ${ty}px)`;

            // Set movement values for the game loop
            moveX = tx / 50;
            moveZ = ty / 50;
        };

        container.addEventListener('touchstart', (e) => { dragging = true; handleMove(e); });
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', () => {
            dragging = false;
            moveX = 0; moveZ = 0;
            knob.style.transform = `translate(0, 0)`;
        });

        // --- GAME LOOP ---
        let score = 0;
        function animate() {
            requestAnimationFrame(animate);

            // Apply movement from joystick
            player.position.x += moveX * 0.2;
            player.position.z += moveZ * 0.2;

            // Simple collision
            if (player.position.distanceTo(target.position) < 1) {
                score += 10;
                document.getElementById('score').innerText = score;
                target.position.set((Math.random()-0.5)*20, 0.5, (Math.random()-0.5)*20);
            }

            // Smooth Camera Follow
            camera.position.lerp(new THREE.Vector3(player.position.x, 7, player.position.z + 10), 0.1);
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
