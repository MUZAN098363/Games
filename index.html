<!DOCTYPE html>
<html>
<head>
<title>Mini Games Hub</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}
button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}
.game {
    display: none;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>🎮 Mini Games Website</h1>

<button onclick="showGame('guess')">Number Guess</button>
<button onclick="showGame('click')">Click Speed</button>
<button onclick="showGame('rps')">Rock Paper Scissors</button>

<!-- Number Guess Game -->
<div id="guess" class="game">
    <h2>Guess the Number (1-10)</h2>
    <input type="number" id="guessInput">
    <button onclick="checkGuess()">Guess</button>
    <p id="guessResult"></p>
</div>

<!-- Click Speed Game -->
<div id="click" class="game">
    <h2>Click Speed Game (5 sec)</h2>
    <button onclick="startClickGame()">Start</button>
    <h3 id="clickCount">0</h3>
</div>

<!-- Rock Paper Scissors -->
<div id="rps" class="game">
    <h2>Rock Paper Scissors</h2>
    <button onclick="play('rock')">Rock</button>
    <button onclick="play('paper')">Paper</button>
    <button onclick="play('scissors')">Scissors</button>
    <p id="rpsResult"></p>
</div>

<script>
function showGame(game) {
    document.querySelectorAll('.game').forEach(g => g.style.display = 'none');
    document.getElementById(game).style.display = 'block';
}

// Guess Game
let random = Math.floor(Math.random() * 10) + 1;
function checkGuess() {
    let user = document.getElementById("guessInput").value;
    if (user == random) {
        document.getElementById("guessResult").innerText = "Correct!";
    } else {
        document.getElementById("guessResult").innerText = "Try Again!";
    }
}

// Click Game
let count = 0;
function startClickGame() {
    count = 0;
    document.getElementById("clickCount").innerText = count;
    let btn = document.createElement("button");
    btn.innerText = "Click Me!";
    btn.onclick = () => {
        count++;
        document.getElementById("clickCount").innerText = count;
    };
    document.getElementById("click").appendChild(btn);

    setTimeout(() => {
        alert("Time up! Score: " + count);
        btn.remove();
    }, 5000);
}

// RPS Game
function play(user) {
    let choices = ["rock", "paper", "scissors"];
    let comp = choices[Math.floor(Math.random() * 3)];

    let result = "";
    if (user === comp) result = "Draw!";
    else if (
        (user === "rock" && comp === "scissors") ||
        (user === "paper" && comp === "rock") ||
        (user === "scissors" && comp === "paper")
    ) result = "You Win!";
    else result = "You Lose!";

    document.getElementById("rpsResult").innerText = 
        "Computer: " + comp + " | " + result;
}
</script>

</body>
</html>
